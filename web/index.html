<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131417">
<meta name="color-scheme" content="dark">
<title>왔다감 - 여행 기록</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <section id="notice" class="notice" hidden>
    <p class="brand">왔다감</p>
    <h1 id="notice-title"></h1>
    <p id="notice-body" class="notice-body" hidden></p>
    <ol id="notice-steps" class="steps" hidden>
      <li><span class="step-num" aria-hidden="true">1</span><span>차에서 여행을 열어요</span></li>
      <li><span class="step-num" aria-hidden="true">2</span><span>“휴대폰으로 보내기”를 눌러요</span></li>
      <li><span class="step-num" aria-hidden="true">3</span><span>화면의 QR 코드를 휴대폰 카메라로 찍어요</span></li>
    </ol>
    <button id="notice-reload" type="button" class="primary-button" hidden>페이지 새로 고침</button>
  </section>

  <div id="trip" hidden>
    <header class="head">
      <p class="brand">왔다감</p>
      <p id="trip-meta" class="meta"></p>
      <h1 id="trip-title"></h1>
      <dl id="trip-stats" class="stats"></dl>
    </header>

    <div id="route" class="route">
      <canvas id="route-canvas" role="img"></canvas>
    </div>
    <p id="route-note" class="note" hidden></p>

    <section class="stops" aria-labelledby="stops-heading">
      <div class="section-head">
        <h2 id="stops-heading">들른 곳</h2>
        <button id="more-photos" type="button" class="text-button" hidden>사진 더 고르기</button>
      </div>
      <div id="photo-summary" class="summary" role="status" aria-live="polite"></div>
      <ol id="timeline" class="timeline"></ol>
      <p id="timeline-empty" class="note" hidden>이 여행에는 보낸 방문지가 없어요. 집·회사 근처와 공유에서 뺀 곳은 보내지 않아요.</p>
    </section>

    <section id="cards" class="cards" aria-labelledby="cards-heading">
      <h2 id="cards-heading" tabindex="-1">공유할 이미지</h2>
      <div id="card-kinds" class="kinds" role="group" aria-label="이미지 종류">
        <button type="button" class="kind" data-kind="photo" aria-pressed="false">
          <span class="kind-thumb kind-thumb-photo">
            <svg class="kind-svg" width="84" height="152" viewBox="0 0 84 152" aria-hidden="true">
              <rect x="0" y="84" width="84" height="68" fill="rgba(19,20,23,0.6)"></rect>
              <path d="M26 61 C 34 56, 41 50, 47.5 43.6 C 52 39, 57 31, 62 28 Q 72 29 72.4 37.3 Q 72 44 60 43.6 Q 53 43 47.5 43.6" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="37.4" cy="52.4" r="1.6" fill="#A4A8AE"></circle>
              <circle cx="62" cy="28" r="3" fill="#F5A623"></circle>
              <circle cx="72.4" cy="37.3" r="3" fill="#F5A623"></circle>
              <circle cx="60" cy="43.6" r="3" fill="#F5A623"></circle>
              <rect x="6" y="95" width="22" height="3" rx="1.5" fill="#F5A623"></rect>
              <rect x="6" y="101" width="56" height="5" rx="2" fill="#FFFFFF"></rect>
              <rect x="6" y="110" width="72" height="1" fill="rgba(255,255,255,0.3)"></rect>
              <rect x="6" y="114" width="14" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="34" y="114" width="8" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="56" y="114" width="22" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="6" y="127" width="12" height="3" rx="1.5" fill="#F5A623"></rect>
            </svg>
          </span>
          <span class="kind-name">사진 배경</span>
        </button>
        <button type="button" class="kind" data-kind="story" aria-pressed="false">
          <span class="kind-thumb kind-thumb-tall">
            <svg class="kind-svg" width="84" height="152" viewBox="0 0 84 152" aria-hidden="true">
              <path d="M12 86 C 22 78, 31 69, 40 59 C 46 51, 52 37, 58 32 Q 68 33 69 44 Q 70 52 55 53 Q 46 54 40 59" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="26.8" cy="72.9" r="1.6" fill="#A4A8AE"></circle>
              <circle cx="58" cy="32" r="3.2" fill="#F5A623"></circle>
              <circle cx="69" cy="44" r="3.2" fill="#F5A623"></circle>
              <circle cx="55" cy="53" r="3.2" fill="#F5A623"></circle>
              <rect x="6" y="95" width="22" height="3" rx="1.5" fill="#F5A623"></rect>
              <rect x="6" y="101" width="56" height="5" rx="2" fill="#FFFFFF"></rect>
              <rect x="6" y="110" width="72" height="1" fill="rgba(255,255,255,0.3)"></rect>
              <rect x="6" y="114" width="14" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="34" y="114" width="8" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="56" y="114" width="22" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="6" y="127" width="12" height="3" rx="1.5" fill="#F5A623"></rect>
            </svg>
          </span>
          <span class="kind-name">스토리</span>
        </button>
        <button type="button" class="kind" data-kind="square" aria-pressed="false">
          <span class="kind-thumb kind-thumb-square">
            <svg class="kind-svg" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
              <rect x="9" y="5" width="10" height="3" rx="1.5" fill="#F5A623"></rect>
              <path d="M12 35 C 20 36.5, 29 33, 40.5 34 C 48 35, 56 30.5, 62 26.5 C 65 24.5, 67 24, 68.5 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="40.5" cy="34" r="1.6" fill="#A4A8AE"></circle>
              <rect x="64" y="21.4" width="9" height="5.2" rx="2.6" fill="#F5A623"></rect>
              <rect x="9" y="47" width="22" height="3" rx="1.5" fill="#F5A623"></rect>
              <rect x="9" y="52" width="56" height="5" rx="2" fill="#FFFFFF"></rect>
              <rect x="9" y="61" width="66" height="1" fill="rgba(255,255,255,0.3)"></rect>
              <rect x="12" y="65" width="12" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="37" y="65" width="7" height="5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="54" y="65" width="18" height="5" rx="1.5" fill="#FFFFFF"></rect>
            </svg>
          </span>
          <span class="kind-name">정사각형</span>
        </button>
        <button type="button" class="kind" data-kind="stops" aria-pressed="false">
          <span class="kind-thumb kind-thumb-stops">
            <svg class="kind-svg" width="84" height="106" viewBox="0 0 84 106" aria-hidden="true">
              <rect x="5" y="3" width="16" height="2.5" rx="1.2" fill="#F5A623"></rect>
              <rect x="5" y="7.5" width="40" height="3.5" rx="1.5" fill="#FFFFFF"></rect>
              <rect x="68" y="3" width="11" height="2.5" rx="1.2" fill="#F5A623"></rect>
              <rect x="0" y="13" width="84" height="30" fill="#4A5560"></rect>
              <rect x="0" y="44" width="84" height="30" fill="#2F3A44"></rect>
              <rect x="0" y="75" width="84" height="31" fill="#353D47"></rect>
              <circle cx="8" cy="36" r="3" fill="#F5A623"></circle>
              <rect x="14" y="33" width="22" height="4" rx="1.5" fill="#FFFFFF"></rect>
              <circle cx="8" cy="67" r="3" fill="#F5A623"></circle>
              <rect x="14" y="64" width="28" height="4" rx="1.5" fill="#FFFFFF"></rect>
              <circle cx="8" cy="98" r="3" fill="#F5A623"></circle>
              <rect x="14" y="95" width="30" height="4" rx="1.5" fill="#FFFFFF"></rect>
            </svg>
          </span>
          <span class="kind-name">들른 곳별</span>
        </button>
      </div>
      <p id="card-hint" class="card-hint"></p>
      <div id="card-preview" class="preview"></div>
      <p id="card-empty" class="preview-empty" hidden></p>
      <div id="bg-photos" class="bg-photos" role="group" aria-label="배경 사진" hidden></div>
      <p id="card-status" class="card-status" role="status" aria-live="polite"></p>
      <ul id="card-downloads" class="downloads"></ul>
    </section>

    <footer class="foot">
      <p>여행 정보는 이 주소 안에만 들어 있어요. 어디에도 따로 저장하지 않아요.</p>
    </footer>
  </div>
</main>

<div id="bar" class="bar" hidden>
  <div class="bar-body">
    <p id="bar-hint" class="bar-hint"></p>
    <button id="bar-button" type="button" class="primary-button"></button>
  </div>
</div>
<!-- 파일 선택은 아래 바와 "사진 더 고르기" 버튼이 input.click() 으로 연다. 이 입력 자체는 초점을 받지 않는다 -->
<input id="photo-input" class="visually-hidden" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<noscript><p class="noscript">이 페이지는 JavaScript 를 켜야 볼 수 있어요.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
